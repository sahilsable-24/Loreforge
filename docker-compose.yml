services:
  db:
    image: pgvector/pgvector:pg16   # Postgres with the vector extension built in
    env_file: .env
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]   # keeps data after the container stops
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  pgdata: